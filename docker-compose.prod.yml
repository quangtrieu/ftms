# Bản prod cho máy chủ 150.95.108.206 — thêm Caddy (HTTPS, một origin), đóng cổng api
services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443", "443:443/udp" ]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [ api ]

  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      COOKIE_SECURE: "1"
      ALLOW_DEV_HEADER: "0"

  db:
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
